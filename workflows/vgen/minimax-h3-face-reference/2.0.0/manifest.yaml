schema_version: 1
id: vgen/minimax-h3-face-reference
version: 2.0.0
title: Temporal single-face swap
summary: Replace one visible face frame by frame while retaining the source video's pixels, motion, timing and original audio.
license: MIT
provenance: market
publisher:
  id: vgen
  public_key: null
homepage: https://vgen.zcbiz.com
source: https://github.com/deofly/vgen/tree/main/workflows/vgen/minimax-h3-face-reference/2.0.0
parameters:
  type: object
  additionalProperties: false
  required:
    - prompt
    - image
    - video
  properties:
    prompt:
      type: string
      minLength: 1
      maxLength: 10000
      description: Task description and confirmation that the supplied face materials are authorized.
    image:
      type: string
      minLength: 1
      contentMediaType: image/*
    video:
      type: string
      minLength: 1
      contentMediaType: video/*
    seed:
      type: integer
      minimum: -1
      default: -1
      description: Accepted for 1.x command compatibility; this deterministic workflow does not use randomness.
    start_time:
      type: number
      minimum: 0
      maximum: 3600
      default: 0
    strength:
      type: number
      minimum: 0
      maximum: 1
      default: 1
    identity_shape:
      type: number
      minimum: 0
      maximum: 0.6
      default: 0.3
    feather:
      type: number
      minimum: 0.01
      maximum: 0.12
      default: 0.045
variants:
  - name: comfyui
    executor_type: comfyui
    payload_format: comfyui-api-graph/v1
    payload: workflow.json
    mapping: mapping.json
    operations:
      - v2v
    executor_min_version: 1.3.0
    runtime_min_version: 0.33.0
    models:
      - filename: face_landmarker.task
        folder: face_landmarkers

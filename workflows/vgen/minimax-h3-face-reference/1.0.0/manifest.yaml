  required:
  - prompt
  - image
  - video
  properties:
    prompt:
      type: string
      minLength: 1
      maxLength: 10000
    image:
      type: string
      minLength: 1
      contentMediaType: image/*
    video:
      type: string
      minLength: 1
      contentMediaType: video/*
    seed:
      type: integer
      minimum: -1
      default: -1
    steps:
      type: integer
      minimum: 20
      maximum: 30
      default: 20
    width:
      type: integer
      enum:
      - 480
      - 768
      - 832
      - 1344
      default: 480
    height:
      type: integer
      enum:
      - 480
      - 768
      - 832
      - 1344
      default: 832
    start_time:
      type: number
      minimum: 0
      maximum: 3600
      default: 0
    ref_image_size:
      type: string
      enum:
      - match
      - max
      default: match
  oneOf:
  - properties:
      width:
        const: 480
      height:
        const: 832
  - properties:
      width:
        const: 832
      height:
        const: 480
  - properties:
      width:
        const: 768
      height:
        const: 1344
  - properties:
      width:
        const: 1344
      height:
        const: 768

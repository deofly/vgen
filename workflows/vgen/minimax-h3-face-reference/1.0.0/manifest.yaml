id: vgen/minimax-h3-face-reference
version: 1.0.0
title: MiniMax H3 face-reference video (preview)
summary: 'Preview: regenerate a single-person video using a face photo and original
  soundtrack. Requires Executor 1.3.0; GPU output not yet validated.'
license: MIT

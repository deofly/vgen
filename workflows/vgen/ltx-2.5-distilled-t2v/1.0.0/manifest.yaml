parameters:
  type: object
  additionalProperties: false
  required:
    - prompt
  properties:
    prompt:
      type: string
      minLength: 1
    seed:
      type: integer
      minimum: -1
      default: -1
    duration:
      type: integer
      minimum: 1
      default: 5
      description: Clip length in whole seconds. Frame count is duration * fps + 1.
    width:
      type: integer
      minimum: 256
      multipleOf: 32
      default: 1280
    height:
      type: integer
      minimum: 256
      multipleOf: 32
      default: 736
    fps:
      type: integer
      minimum: 8
      multipleOf: 8
      default: 24

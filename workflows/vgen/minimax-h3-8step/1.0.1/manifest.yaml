parameters:
  type: object
  additionalProperties: false
  required:
    - prompt
  properties:
    prompt:
      type: string
      minLength: 1
    seed:
      type: integer
      minimum: -1
      default: -1
    steps:
      type: integer
      minimum: 1
      maximum: 100
      default: 8
    width:
      type: integer
      minimum: 256
      multipleOf: 16
      default: 768
    height:
      type: integer
      minimum: 256
      multipleOf: 16
      default: 1344
    frames:
      type: integer
      minimum: 1
      default: 39
    fps:
      type: number
      exclusiveMinimum: 0
      default: 24
    image:
      type: string
      contentMediaType: image/*
    last_image:
      type: string
      contentMediaType: image/*

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vgen"
version = "0.13.1"
description = "Open, encrypted GPU workflow gateway, broker and worker runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "VGen Contributors" }]
keywords = ["gpu", "workflow", "comfyui", "diffusion", "worker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argcomplete>=3.6",
  "cryptography>=44",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "keyring>=25",
  "mnemonic>=0.21",
  "packaging>=24",
  "platformdirs>=4.3",
  "pydantic>=2.10",
  "PyNaCl>=1.5",
  "PyYAML>=6.0",
  "requests>=2.32",
  "rich>=13.9",
  "oss2>=2.18",
]

[project.optional-dependencies]
gateway = [
  "fastapi>=0.115",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.18",
  "uvicorn[standard]>=0.34",
]
broker = ["pydantic-settings>=2.7"]
worker-comfyui = [
  "pydantic-settings>=2.7",
  "websocket-client>=1.8",
]
oss = [
  "alibabacloud-credentials>=0.3.4",
  "alibabacloud-sts20150401>=1.2.0",
  "alibabacloud-tea-openapi>=0.4.0",
]
dev = [
  "bandit[toml]>=1.8",
  "build>=1.2",
  "httpx2>=2.12",
  "pip-audit>=2.8",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
vgen = "vgen.cli.main:main"
vgen-gateway = "vgen.gateway.main:main"
vgen-broker = "vgen.broker.main:main"
vgen-worker = "vgen.worker.main:main"

[project.entry-points."vgen.executors"]
comfyui = "vgen.executors.comfyui:ComfyUIExecutor"

[project.entry-points."vgen.artifacts"]
local = "vgen.artifacts.local:LocalArtifactAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/vgen"]

[tool.hatch.build.targets.wheel.force-include]
"workflows/vgen/minimax-h3-8step/1.0.0" = "vgen/assets/workflows/vgen/minimax-h3-8step/1.0.0"
"workflows/vgen/ltx-2.5-distilled-t2v/1.0.0" = "vgen/assets/workflows/vgen/ltx-2.5-distilled-t2v/1.0.0"
"examples/windows-worker/enroll-worker.ps1" = "vgen/assets/worker/enroll-worker.ps1"
"examples/windows-worker/setup-worker.ps1" = "vgen/assets/worker/setup-worker.ps1"
"examples/windows-worker/start-worker.cmd" = "vgen/assets/worker/start-worker.cmd"
"examples/comfyui-minimax-h3-policy.yaml" = "vgen/assets/worker/comfyui-minimax-h3-policy.yaml"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/vgen/gateway/app.py" = ["B008"]

[tool.bandit]
exclude_dirs = ["tests"]
# VGen invokes fixed argv arrays without a shell. B404/B603 flag every such
# subprocess use regardless of whether input can become shell syntax. B105 also
# treats protocol field names and user-facing help containing "secret" as
# embedded passwords. Keep the more specific process-path and data-flow checks.
skips = ["B105", "B404", "B603"]

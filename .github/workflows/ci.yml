name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sdks/python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[gateway,broker,worker-comfyui,oss,dev]'
      - run: python -m pip install -e 'sdks/python[dev]'
      - run: ruff check src tests tools sdks/python/src sdks/python/tests
      - run: python -m pytest
      - run: python -m pytest
        working-directory: sdks/python
      - run: python tools/export_openapi_v1.py --check
      - run: python -m build
      - run: python -m build sdks/python --outdir /tmp/vgen-python-sdk-dist
      - run: python tools/check_distribution.py dist
      - run: python tools/check_public_repository.py

  java-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode test
        working-directory: sdks/java

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[gateway,broker,worker-comfyui,oss,dev]'
      - run: python -m pip_audit . --progress-spinner off
      - run: bandit -c pyproject.toml -r src tools sdks/python/src

  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Parse the Worker installers with Windows PowerShell 5.1
        shell: powershell
        run: |
          @'
          import importlib.util
          import os
          import sys
          from pathlib import Path

          source = Path("tools/build_public_release.py")
          spec = importlib.util.spec_from_file_location("build_public_release_ci", source)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          output = Path(os.environ["RUNNER_TEMP"]) / "install-windows-worker.ps1"
          output.write_bytes(module._windows_worker_bootstrap(
              release_origin="https://downloads.example",
              version="0.9.2",
              manifest_sha256="1" * 64,
          ))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $scripts = @(
            "$PWD\examples\windows-worker\setup-worker.ps1",
            "$env:RUNNER_TEMP\install-windows-worker.ps1"
          )
          foreach ($scriptPath in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$errors
            ) > $null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$scriptPath`: $($_.Message)" }
              exit 1
            }
          }
      - name: Verify the stable Worker launcher and Desktop shortcut
        shell: powershell
        run: |
          .\tests\examples\windows-powershell51-worker-launcher.ps1 `
            -BootstrapPath "$env:RUNNER_TEMP\install-windows-worker.ps1"
      - name: Verify repeated atomic model-path replacement
        shell: powershell
        run: .\tests\examples\windows-powershell51-model-paths.ps1
      - name: Verify safe custom-node staging cleanup
        shell: powershell
        run: .\tests\examples\windows-powershell51-custom-node-staging.ps1
      - name: Verify native installer output isolation
        shell: powershell
        run: .\tests\examples\windows-powershell51-native-output.ps1
      - name: Verify console reuse with redirected ComfyUI logs
        shell: powershell
        run: .\tests\examples\windows-powershell51-no-new-window.ps1

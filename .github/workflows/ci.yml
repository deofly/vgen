name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sdks/python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[gateway,broker,worker-comfyui,oss,dev]'
      - run: python -m pip install -e 'sdks/python[dev]'
      - name: Rebuild the deterministic Windows Worker wheelhouse
        if: matrix.python-version == '3.11' || matrix.python-version == '3.14'
        run: python tools/windows_worker_wheelhouse.py --output "$RUNNER_TEMP/windows-worker-wheelhouse"
      - name: Rebuild the wheelhouse under a restrictive umask
        if: matrix.python-version == '3.11'
        run: |
          umask 077
          python tools/windows_worker_wheelhouse.py --output "$RUNNER_TEMP/windows-worker-wheelhouse-umask077"
          (cd "$RUNNER_TEMP/windows-worker-wheelhouse" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/wheelhouse-default.sha256"
          (cd "$RUNNER_TEMP/windows-worker-wheelhouse-umask077" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/wheelhouse-umask077.sha256"
          diff -u "$RUNNER_TEMP/wheelhouse-default.sha256" "$RUNNER_TEMP/wheelhouse-umask077.sha256"
      - run: ruff check src tests tools sdks/python/src sdks/python/tests
      - run: python -m pytest
      - run: python -m pytest
        working-directory: sdks/python
      - run: python tools/export_openapi_v1.py --check
      - run: python -m build
      - run: python -m build sdks/python --outdir /tmp/vgen-python-sdk-dist
      - run: python tools/check_distribution.py dist
      - run: python tools/check_public_repository.py

  java-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode test
        working-directory: sdks/java

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[gateway,broker,worker-comfyui,oss,dev]'
      - run: python -m pip_audit . --progress-spinner off
      - name: Audit the pinned Windows Worker runtime
        run: |
          python -m pip_audit --progress-spinner off --no-deps --disable-pip -r requirements/windows-worker-binary.lock
          python -m pip_audit --progress-spinner off --no-deps --disable-pip -r requirements/windows-worker-source.lock
          python -m pip_audit --progress-spinner off --no-deps --disable-pip -r requirements/windows-worker-build.lock
      - run: bandit -c pyproject.toml -r src tools sdks/python/src

  windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Windows Worker test dependencies
        run: python -m pip install -e '.[worker-comfyui]' pytest
      - name: Rebuild the reviewed offline Worker wheelhouse on Windows
        run: python tools/windows_worker_wheelhouse.py --output "$env:RUNNER_TEMP\windows-worker-wheelhouse"
      - name: Build the reviewed Windows Worker installer fixture
        shell: powershell
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "worker-dist"
          New-Item -ItemType Directory -Path $dist | Out-Null
          python -m pip wheel --no-deps --wheel-dir $dist .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $dist -Filter "vgen-*.whl")
          if ($wheels.Count -ne 1) { throw "Expected exactly one VGen wheel." }
          $version = (& python -c "import vgen; print(vgen.__version__)").Trim()
          $bundle = Join-Path $env:RUNNER_TEMP "vgen-windows-worker-installer-$version.zip"
          python tools/build_windows_worker_bundle.py `
            --gateway "https://gateway.example" `
            --wheel $wheels[0].FullName `
            --wheelhouse "$env:RUNNER_TEMP\windows-worker-wheelhouse" `
            --output $bundle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $bundle -DestinationPath "$env:RUNNER_TEMP\worker-bundle"
      - name: Exercise Python runtime locking on Windows
        run: >-
          python -m pytest -q
          tests/cli/test_worker_bundle.py
          tests/examples/test_windows_worker_setup.py
          tests/worker/test_updater.py
          tests/worker/test_supervisor.py
          tests/worker/test_model_installer.py
      - name: Parse the Worker installers with Windows PowerShell 5.1
        shell: powershell
        run: |
          @'
          import importlib.util
          import os
          import sys
          from pathlib import Path

          source = Path("tools/build_public_release.py")
          spec = importlib.util.spec_from_file_location("build_public_release_ci", source)
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          output = Path(os.environ["RUNNER_TEMP"]) / "install-windows-worker.ps1"
          output.write_bytes(module._windows_worker_bootstrap(
              release_origin="https://downloads.example",
              version="0.9.2",
              manifest_sha256="1" * 64,
          ))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $scripts = @(
            "$PWD\examples\windows-worker\enroll-worker.ps1",
            "$PWD\examples\windows-worker\setup-worker.ps1",
            "$PWD\examples\windows-worker\supervise-worker.ps1",
            "$env:RUNNER_TEMP\install-windows-worker.ps1"
          )
          foreach ($scriptPath in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$errors
            ) > $null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$scriptPath`: $($_.Message)" }
              exit 1
            }
          }
      - name: Verify the stable Worker launcher and Desktop shortcut
        shell: powershell
        run: |
          .\tests\examples\windows-powershell51-worker-launcher.ps1 `
            -BootstrapPath "$env:RUNNER_TEMP\install-windows-worker.ps1"
      - name: Verify the persistent Worker supervisor lifecycle
        shell: powershell
        run: |
          .\tests\examples\windows-powershell51-worker-supervisor.ps1 `
            -RepositoryRoot "$PWD"
      - name: Verify Worker runtime pointer precedence
        shell: powershell
        run: |
          .\tests\examples\windows-powershell51-runtime-pointer.ps1 `
            -RepositoryRoot "$PWD"
      - name: Verify the offline locked Worker runtime
        shell: powershell
        run: |
          $bootstrapPython = (Get-Command python).Source
          .\tests\examples\windows-powershell51-locked-runtime.ps1 `
            -RepositoryRoot "$PWD" `
            -BundleRoot "$env:RUNNER_TEMP\worker-bundle" `
            -BootstrapPython $bootstrapPython
      - name: Verify repeated atomic model-path replacement
        shell: powershell
        run: .\tests\examples\windows-powershell51-model-paths.ps1
      - name: Verify safe custom-node staging cleanup
        shell: powershell
        run: .\tests\examples\windows-powershell51-custom-node-staging.ps1
      - name: Verify native installer output isolation
        shell: powershell
        run: .\tests\examples\windows-powershell51-native-output.ps1
      - name: Verify console reuse with redirected ComfyUI logs
        shell: powershell
        run: .\tests\examples\windows-powershell51-no-new-window.ps1
